# Conda environment for levels B–D: the reproduction toolkit (groh2024_repro_kit/), the scripts in logs/,
# and the demo website. Versions match the environment used for the recorded runs (Python 3.9.23).
name: groh
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pandas=1.4
  - numpy=1.21
  - scipy=1.7
  - matplotlib=3.5
  - seaborn=0.11
  - statsmodels=0.13
  - scikit-learn=1.0
  - notebook=6
  - flask
  - pip
  - pip:
      - stargazer==0.0.7
