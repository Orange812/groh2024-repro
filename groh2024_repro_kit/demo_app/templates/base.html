<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Diagnosing Diagnosis · classroom replica{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">Diagnosing Diagnosis</a>
    <span class="tag">Classroom replica of the experiment in Groh et al., <i>Nature Medicine</i> 2024</span>
    <a class="dash-link" href="{{ url_for('dashboard') }}">Live results</a>
  </header>
  <main class="wrap">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
